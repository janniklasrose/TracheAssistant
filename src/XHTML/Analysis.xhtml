        <h1>Preparing for data analysis</h1>

            <!-- Convergence -->
            <ul>
                <li>
                    <a href="staraction:setConvergence">Set</a> the convergence monitors.
                    <information>
                        <br />
                        <b>Explanation:</b>
                        Turns off normalisation for residuals and adds monitors for corrections.
                    </information>

            </ul>

            <!-- Resources -->
            <ul>
                <li>
                    <a href="staraction:setResources">Set</a> the resource consumption monitors.
                    <information>
                        <br />
                        <b>Explanation:</b>
                        Creates reports and monitors for CPU and memory usage.
                    </information>
                </li>
            </ul>
